     CredentialScrubber's param regex the way a result-borne innerHtml would be (that corruption is issue #70).
     A full-document capture includes the doctype and the <html> element itself; a #content capture is that
     element's outerHTML subtree only (no <html>/<head>/<footer>). See FIXTURE_NOTES.md. -->

  </div>
  <footer>LJCMG parcel viewer</footer>
</body>
</html>
