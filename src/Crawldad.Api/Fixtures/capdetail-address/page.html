<!-- Synthesized (not captured) CapDetail LOCATION region — LJCMGClient.cs:229-268. See FIXTURE_NOTES.md.
     Rows matched by "#tbl_worklocation tr:first-child, #tbl_worklocation tr[tips='tr_additional_locations']":
       row 1 (tr:first-child)                     -> InnerHTML.Split("<br>").Length == 3   (3-branch)
       rows 2-4 (tips='tr_additional_locations')  -> 4-branch, 5-branch, exceptional (==2)

     whitespace text nodes, exactly like a browser) has no stray whitespace and the <br>/<span> split arithmetic is
     exact. The first <span> child is address1 (carries the '*' chars that .Replace("*","") strips); a trailing
     <span> map link is glued onto the city/state/zip line to exercise .Split("<span")[0]. -->
