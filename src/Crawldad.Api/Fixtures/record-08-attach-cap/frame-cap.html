<!DOCTYPE html>
<!-- Attachments grid served inside the iframe on BOTH cyclic states (att_a and att_b). It has the "No records found."
     placeholder (so no download ever fires and attachments stays empty) and a PERSISTENT "Next" anchor in
     table.aca_pagination td:last-child, so hasNextPageLink is always true — the pagination never terminates on its
     own. The do-while stops only when attPagesVisited reaches 50 (the safety cap), which logs the cap warning. The
     SelectedPageButton text is irrelevant here (the page-number waitFor uses state "visible", a no-op in the fake). -->
<html lang="en">
<head><meta charset="utf-8"></head>
<body>
  <table id="attachmentList_gdvAttachmentList">
    <tbody>
      <tr class="header"><td>Name</td><td>Desc</td><td>Cat</td><td>MIME</td><td>Type</td><td>Size</td><td>Latest Update</td></tr>
      <tr><td colspan="7">No records found.</td></tr>
      <tr class="ACA_Table_Pages">
        <td colspan="7">
          <table class="aca_pagination">
            <tbody>
              <tr>
                <td><span class="SelectedPageButton">1</span></td>
                <td><a href="javascript:__doPostBack('next')">Next</a></td>
              </tr>
            </tbody>
          </table>
        </td>
      </tr>
    </tbody>
  </table>
</body>
</html>
