name: Live canary

# The nightly/manual drift signal (issue #7; drift/observability in docs/SPEC.md): scrape ONE real enforcement record
# from the LIVE Accela portal and validate the RecordScrapedV1 shape. This is the ONLY workflow that sends live
# third-party traffic, and it is NEVER triggered by push or pull_request — only the nightly schedule and manual
# dispatch. A failed run (status != succeeded, or a broken shape) fails the job → that red check is the drift alert.
on:
  schedule:
    # Nightly at 07:17 UTC. Off-peak, once a day — gentle by design (the payload also enforces the 2 s route throttle).
    - cron: "17 7 * * *"
  workflow_dispatch:
    inputs:
      link:
        description: "Record link (a CapDetail.aspx URL). Overrides the CRAWLDAD_CANARY_LINK repo variable."
        required: false
        type: string
      publishDate:
        description: "Optional publish date bound to the record (YYYY-MM-DD)."
        required: false
        type: string
      region:
        description: "Optional region tag recorded on the run."
        required: false
        type: string

# Concurrency 1 against the live site: a second canary (e.g. a manual run overlapping the nightly) queues behind the
# running one instead of hitting the portal in parallel.
concurrency:
  group: live-canary
  cancel-in-progress: false

jobs:
  canary:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # The hard opt-in the LiveCanaryFact gate checks. Present only in THIS workflow.
      CRAWLDAD_LIVE_CANARY: "1"
      # Dispatch inputs win; otherwise fall back to repo variables (Settings → Secrets and variables → Actions →
      # Variables). The link is a public URL, so a repo variable is appropriate; use a secret if you prefer.
      CRAWLDAD_CANARY_LINK: ${{ github.event.inputs.link || vars.CRAWLDAD_CANARY_LINK }}
      CRAWLDAD_CANARY_PUBLISH_DATE: ${{ github.event.inputs.publishDate || vars.CRAWLDAD_CANARY_PUBLISH_DATE }}
      CRAWLDAD_CANARY_REGION: ${{ github.event.inputs.region || vars.CRAWLDAD_CANARY_REGION }}
      ConnectionStrings__marten: "Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=postgres"
      DOTNET_NOLOGO: "true"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

    steps:
      - uses: actions/checkout@v4

      # A canary with no link self-skips and watches nothing, so a missing link must not stay silently green:
      # scheduled runs warn through the grace deadline below, then FAIL; a manual dispatch with no link fails
      # immediately, since the operator is present to supply one.
      - name: Check configuration
        run: |
          if [ -n "${CRAWLDAD_CANARY_LINK}" ]; then
            echo "Live canary target configured."
            exit 0
          fi
          GRACE_ENDS="2026-08-17"
          MSG="CRAWLDAD_CANARY_LINK is not set (no dispatch input, no repo variable) — the live canary will SELF-SKIP and watch nothing. Set the CRAWLDAD_CANARY_LINK repo variable or pass the 'link' dispatch input."
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] || [ "$(date -u +%F)" '>' "${GRACE_ENDS}" ]; then
            echo "::error::${MSG}"
            exit 1
          fi
          echo "::warning::${MSG} Scheduled runs FAIL after ${GRACE_ENDS}."

      - name: Set up .NET (from global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Debug to match ci.yml (config is immaterial here — coverage is off — and it keeps one mental model).
      - name: Build
        run: dotnet build Crawldad.slnx -c Debug

      - name: Install Playwright Chromium
        run: eng/install-browsers.sh Debug

      # Run ONLY the live canary, through the retry-once wrapper (issue #92). Coverage is off — a single-test run
      # cannot meet the 100% gate (that gate is CI's). This is the real live hit: real Chromium, real network, session
      # policy for real, concurrency 1. If CRAWLDAD_CANARY_LINK is unset the test self-skips and the job passes green.
      #
      # The wrapper retries EXACTLY ONCE, and only for the portal maintenance-window false alarm: if the first attempt
      # fails with a transient `record_not_accessible` (CapDetail briefly redirecting to Error.aspx during Accela's
      # overnight app-pool recycle), it waits CANARY_RETRY_DELAY_SECONDS and runs the canary once more; only the second
      # failure — or ANY other failure class on the first attempt — fails the job (real drift still fails fast, on the
      # first occurrence). Concurrency-1 still holds across the wait. The wrapper's decision + orchestration are
      # unit-tested by eng/canary-retry.selftest.sh (run in ci.yml).
      - name: Live canary
        env:
          # ~10 minutes: long enough to clear a typical maintenance / app-pool-recycle blip, short enough to stay well
          # inside the job timeout. A second (e.g. manual) canary queues behind this one, including through this wait.
          CANARY_RETRY_DELAY_SECONDS: "600"
        run: eng/canary-retry.sh
