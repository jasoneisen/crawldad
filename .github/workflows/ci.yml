name: CI

# The fast loop: build (warnings-as-errors), format-verify, and the full test suite under the 100% line+branch
# coverage gate. Runs on every push/PR to main. It explicitly filters OUT the live canary (Category=LiveCanary) as
# defense in depth — the canary already self-skips without CRAWLDAD_LIVE_CANARY=1 + CRAWLDAD_CANARY_LINK, so this loop
# NEVER sends live third-party traffic. The canary lives in its own scheduled/manual workflow (canary.yml).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# One in-flight run per ref; a newer push cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest

    # Marten needs Postgres. Mapped to localhost:5432 on the runner VM; the connection string below points at it,
    # overriding appsettings.json's devcontainer "Host=db".
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      # The Azurite blob emulator: the durable Azure adapter's tests point at this loopback service — a local
      # emulator, NOT live Azure, so the fast loop still sends zero live third-party traffic. The image's default command
      # binds the blob host to 0.0.0.0, so the runner reaches it at 127.0.0.1:10000; the fixture retries to cover startup.
      azurite:
        image: mcr.microsoft.com/azure-storage/azurite:latest
        ports:
          - 10000:10000

    env:
      # ConnectionStrings__marten → ConnectionStrings:marten (read by GetConnectionString("marten")).
      ConnectionStrings__marten: "Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=postgres"
      # Point the Azurite suite at the loopback emulator service above (the well-known public dev account key).
      CRAWLDAD_AZURITE_CONNECTION: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://127.0.0.1:10000/devstoreaccount1;"
      DOTNET_NOLOGO: "true"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

    steps:
      - uses: actions/checkout@v4

      # Fast, dotnet-free guard for the live-canary retry-once wrapper (issue #92): pins the retry semantics with a
      # scripted fake canary and a recording no-op sleep (a transient record_not_accessible → one delayed retry →
      # clears; any other failure alarms immediately, with no retry) — no live traffic, no real waiting. The wrapper
      # itself (eng/canary-retry.sh) runs only in the scheduled/manual canary.yml.
      - name: Canary retry wrapper selftest
        run: eng/canary-retry.selftest.sh

      - name: Set up .NET (from global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Crawldad.slnx

      # Everything runs in DEBUG on purpose: the coverlet 100% line+branch gate is calibrated to Debug. Release IL
      # optimizations reshape a couple of branches (e.g. in PayloadSemanticWalker) into forms coverlet cannot see as
      # hit, so a Release coverage run reports a spurious < 100% even though every path is tested. Do not "upgrade"
      # this to Release without also re-baselining the gate. warnings-as-errors + analyzers are config-agnostic, so
      # Debug is a faithful compile gate too.

      # Gate 1: compile with warnings-as-errors (analyzers + code style are errors via Directory.Build.props). 0/0.
      # Also produces the test output the browser-install step needs.
      - name: Build (warnings-as-errors)
        run: dotnet build Crawldad.slnx -c Debug --no-restore -warnaserror

      # Gate 3: formatting/style is clean.
      - name: Format verify
        run: dotnet format Crawldad.slnx --verify-no-changes --no-restore

      # The real-browser tests in the fast loop (parity, local-adapter, leak) need Chromium. pwsh-free install via
      # the vendored Playwright node driver in the just-built test output.
      - name: Install Playwright Chromium
        run: eng/install-browsers.sh Debug

      # Gate 2: the full suite under the coverlet 100% line+branch gate (enforced by Crawldad.Tests.csproj), split into
      # TWO sequential invocations in this one blocking job (issue #95). On a small hosted runner (2-4 cores) a real
      # headless-Chromium scrape is starved by the rest of the suite running on the other maxParallelThreads lane under
      # coverlet instrumentation: the machine saturates, the scrape crosses the product's 120 s synchronous cap, POST /runs
      # auto-upgrades it to 202, and the tests (which assert 200) fail on every run. Running the main suite first and then
      # the real-Chromium category ALONE — with the whole runner to itself — keeps every scrape synchronous. Coverage is
      # MERGED across the two runs (Threshold=0 on the first, the 100% gate on the merged second) so the real-browser
      # adapter, which only the second run exercises, is still gated. No --no-build: coverlet.msbuild instruments during
      # the test build, so each invocation must run its build. The canary (Category=LiveCanary) is excluded from both.
      - name: Test — main suite (excludes real-Chromium), collect coverage
        run: >
          dotnet test Crawldad.slnx -c Debug
          --filter "Category!=LiveCanary&Category!=RealChromium"
          /p:CoverletOutputFormat=json
          /p:CoverletOutput=${{ github.workspace }}/coverage/
          /p:Threshold=0

      - name: Test — real-Chromium category alone (whole runner), merge coverage + enforce 100% gate
        run: >
          dotnet test Crawldad.slnx -c Debug
          --filter "Category=RealChromium"
          /p:MergeWith=${{ github.workspace }}/coverage/coverage.json
          /p:CoverletOutput=${{ github.workspace }}/coverage/
