# Crawldad connector reverse proxy.
#
# Chromium's remote-debugging endpoint rejects any request whose Host header is
# not localhost/an IP (a DNS-rebinding guard) with a 403. A request arriving via
# the tunnel carries Host: <sub>.trycloudflare.com, so this proxy rewrites Host
# to 127.0.0.1:9222 before forwarding. It also carries the WebSocket upgrade
# through for the long-lived CDP connection.
#
# Runs unprivileged: no `user` directive, a high listen port, and every writable
# path lives under /tmp/crawldad-connector.

worker_processes 1;
pid /tmp/crawldad-connector/nginx/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    access_log off;

    client_body_temp_path /tmp/crawldad-connector/nginx/client_body;
    proxy_temp_path /tmp/crawldad-connector/nginx/proxy;
    fastcgi_temp_path /tmp/crawldad-connector/nginx/fastcgi;
    uwsgi_temp_path /tmp/crawldad-connector/nginx/uwsgi;
    scgi_temp_path /tmp/crawldad-connector/nginx/scgi;

    # WebSocket upgrade plumbing for the CDP connection.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 127.0.0.1:9223;
        server_name _;

        # The DevTools port only trusts a localhost Host header.
        proxy_set_header Host "127.0.0.1:9222";
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # CDP sessions are long-lived and idle between commands.
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;

        location / {
            proxy_pass http://127.0.0.1:9222;
        }
    }
}
